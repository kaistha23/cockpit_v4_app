[project]
name = "cockpit-v4-app"
version = "0.1.0"
description = "Cockpit V4 backend: agentic credit-risk analytics over the V4 lake."
requires-python = ">=3.12"

# Exact pins captured from the source working environment.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "duckdb==1.5.5",
    "pandas==3.0.3",
    "numpy==2.5.0",
    "pyarrow==24.0.0",
    "python-dotenv==1.2.2",
    "anthropic==0.112.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
]
scripts = [
    "openpyxl==3.1.5",
    "pypdf==6.4.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "slow: builds a release or drives a subprocess; minutes, not seconds.",
    "live: exercises a real AI provider; skipped when no key is configured.",
]
